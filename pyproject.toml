[project]
name = "scriptHub-pe-aponti26dev"
version = "0.21.1.dev1"
description = "Central de scripts de automação da Aponti Academy"
readme = "README.md"
requires-python = ">3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "fpdf2>=2.8.7",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.55.0",
    "gspread>=6.2.1",
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "platformdirs>=4.5.0",
    "playwright>=1.60.0",
    "questionary>=2.1.1",
    "rich>=13.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.26.7,<0.27",
]

[project.scripts]
scripthub = "scripthub.cli:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --cov=scripthub --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: testes unitários sem I/O externo",
    "integration: testes com I/O de arquivo real",
]

[tool.coverage.run]
omit = [
    # Automação Playwright — requer browser real
    "src/scripthub/scripts/torpedo/main.py",
    # Padrão B (depreciado) — orquestração não testada diretamente, só helpers
    "src/scripthub/scripts/softskills/main.py",
    # FPDF — requer fontes e renderização
    "src/scripthub/scripts/relatorios/compilar/compilar_pdfs.py",
    # Questionary UI interativa
    "src/scripthub/services/config/ui.py",
    "src/scripthub/services/config/main.py",
    # CLI e i18n — patching de Typer/Click
    "src/scripthub/cli.py",
    "src/scripthub/_i18n.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripthub"]

[tool.ruff]
# Target Python version
target-version = "py310"

# Maximum line length
line-length = 120

[tool.ruff.lint]
# Rules to enable
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Rules to ignore
ignore = []

[tool.ruff.lint.per-file-ignores]
# Padrão A exporta CLI_CMD antes do import de ESCOPOS/get_config (ver CLAUDE.md)
"**/__init__.py" = ["E402"]
# _instalar_i18n() precisa rodar antes dos imports de .scripts/.services (ordem deliberada)
"src/scripthub/cli.py" = ["E402"]

[tool.ruff.format]
# Style settings for the formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
